name: Deploy Plus33

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/vegambymuttikulangarai/plus33-Europe

            git fetch origin
            git reset --hard origin/main

            chmod +x mvnw

            ./mvnw clean package -DskipTests

            sudo systemctl restart plus33
