  PURPOSE:
  Cinematic Product Details view for PLUS33.

  RESPONSIBILITIES:
  - Displays high-end product presentation.
  - Dynamically populates tasting notes, origin terroir, and roast levels.
  - Features an interactive coffee brewing guide calculator.

  ARCHITECTURE NOTES:
  - Dynamically mounted by /global/js/router.js inside the #app SPA root.
  - Fetches product data via /api/store/products/{id} and binds to the layout.

<div class="product-details-page">
  <div class="container">
    <!-- Back Button -->
    <a href="/store" class="details-back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to Store</span>
    </a>

    <!-- Main Detail Grid -->
    <div class="details-grid" id="product-details-root">
      <!-- Loading Skeleton (Replaced by JS) -->
      <div class="details-loading">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-image"></div>
        <div class="skeleton skeleton-text"></div>
      </div>
    </div>
  </div>
</div>
